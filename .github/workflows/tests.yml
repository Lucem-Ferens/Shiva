name: tests
# Runs the test suite on Windows with the exact package versions pinned in requirements/lock.txt.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: "1"
      QT_QPA_PLATFORM: offscreen
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.13"
      - name: Install the pinned packages (hashes are checked)
        run: python -m pip install --require-hashes -r requirements/lock.txt
      - name: Fetch the pinned age binaries (SHA-256 checked)
        run: python tools/fetch_third_party.py
      - name: Run the tests
        run: python -m pytest -q
