name: tests
# Runs the test suite on Windows with the exact package versions pinned in requirements/lock.txt.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: "1"
      QT_QPA_PLATFORM: offscreen
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install the pinned packages (hashes are checked)
        run: python -m pip install --require-hashes -r requirements/lock.txt
      - name: Fetch the pinned age binaries (SHA-256 checked)
        run: python tools/fetch_third_party.py
      - name: Run the tests
        run: python -m pytest -q
