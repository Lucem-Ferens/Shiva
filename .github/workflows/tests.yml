name: tests
# Runs the test suite on Windows with the exact package versions pinned in requirements/lock.txt.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: "1"
      QT_QPA_PLATFORM: offscreen
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.13"
      - name: Install the pinned packages (hashes are checked)
        run: python -m pip install --require-hashes -r requirements/lock.txt
      - name: Fetch the pinned age binaries (SHA-256 checked)
        run: python tools/fetch_third_party.py
      - name: Run the tests
        shell: bash
        run: |
          set +e          # the step's shell runs with -e: keep going after a failure, to report it
          python -X faulthandler -m pytest -q 2>&1 | tee pytest.log
          code=${PIPESTATUS[0]}
          echo "pytest exit code: $code"
          if [ "$code" -ne 0 ]; then
            # failed test names as annotations: readable on the run page without signing in
            grep -E '^(FAILED|ERROR) ' pytest.log | head -10 | sed 's/%/%25/g' | while IFS= read -r line; do
              echo "::error title=pytest::${line}"
            done
          fi
          exit $code
