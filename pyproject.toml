[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shiva"
version = "0.0.4"
description = "Windows portable tool: metadata cleaning, age encryption, file shredding"
requires-python = ">=3.12"
license = { text = "GPL-3.0-or-later" }
dependencies = ["PySide6-Essentials>=6.12", "Pillow>=13.0", "pikepdf>=10.17", "pypdfium2>=5.14"]

[project.optional-dependencies]
dev = ["pytest", "nuitka", "mutagen>=1.48"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
